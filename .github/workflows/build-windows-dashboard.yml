name: Windows Desktop App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bounty_hunter/**"
      - "scripts/dashboard_entry.py"
      - "START-DASHBOARD.bat"
      - "tests/**"
      - "pyproject.toml"
      - "installer/**"
      - ".github/workflows/build-windows-dashboard.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m compileall -q bounty_hunter scripts/dashboard_entry.py
      - name: Test earnings accounting
        run: python -m unittest discover -s tests -p test_earnings.py -v
      - name: Test BountyPay HTTP failure handling
        run: python -m unittest discover -s tests -p test_bountypay.py -v
      - name: Test desktop setup and scanner
        run: python -m unittest discover -s tests -p test_desktop_app.py -v
      - name: Test GitHub enrichment, scoring and actionable filtering
        run: python -m unittest tests.test_cli tests.test_scoring tests.test_github tests.test_report tests.test_actionable tests.test_algora_discovery tests.test_algora tests.test_boss tests.test_opire tests.test_preflight tests.test_submission tests.test_agent tests.test_review -v
      - name: Test readiness and workflow controls
        run: python -m unittest discover -s tests -p test_desktop_readiness.py -v
      - name: Test Windows execution and update controls
        run: python -m unittest discover -s tests -p test_windows_desktop.py -v
      - name: Smoke-test every native desktop screen
        run: python -m unittest discover -s tests -p test_desktop_gui.py -v
      - name: Install Windows packager
        run: python -m pip install "pyinstaller>=6,<7"
      - name: Build one-file BountyHunter.exe
        run: pyinstaller --noconfirm --clean --onefile --windowed --name BountyHunter --paths . scripts/dashboard_entry.py
      - name: Smoke-test the packaged executable
        shell: pwsh
        run: |
          $app = Start-Process -FilePath ".\dist\BountyHunter.exe" -ArgumentList "--smoke-test" -PassThru
          if (!$app.WaitForExit(60000)) { $app.Kill(); throw "Packaged app smoke test timed out" }
          if ($app.ExitCode -ne 0) { throw "Packaged app smoke test failed: $($app.ExitCode)" }
      - name: Upload portable Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: BountyHunter-Windows-Portable
          path: dist/BountyHunter.exe
          if-no-files-found: error
          retention-days: 14
      - name: Install NSIS
        run: choco install nsis --no-progress -y
      - name: Build click-to-install Windows Setup
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\\NSIS\\makensis.exe"
          if (!(Test-Path $nsis)) { throw "NSIS installation not found" }
          & $nsis /V3 installer/BountyHunter.nsi
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
      - name: Upload click-to-install Windows Setup
        uses: actions/upload-artifact@v4
        with:
          name: BountyHunter-Windows-Installer
          path: dist/BountyHunter-Setup.exe
          if-no-files-found: error
          retention-days: 14

